    <h1>🗃️ 哈希表：O(1) 查找、冲突与扩容</h1>
    <p>哈希表用“哈希函数 + 数组”把 key 映射到桶，平均 O(1) 找到。但冲突不可避免、扩容会重排所有元素、最坏情况会退化成 O(n)。这一页把哈希、链地址、装填因子和 rehash 画清楚。</p>
  </header>
