    <h1>🌀 内存序：两个线程，谁先看到谁？</h1>
    <p>同一份代码在 x86 上跑一万次都对，换到 ARM 就可能崩——不是运气，而是编译器和 CPU 都能重排内存访问。这一页从重排讲到 happens-before，最后给出可以直接照抄的选择规则。</p>
  </header>

  <text x="626" y="232" class="svg-bad-text">✗ 可能</text>
  <text x="440" y="278" class="svg-small">靠 acquire/release 或显式屏障</text>
  <text x="440" y="300" class="svg-small">约束顺序，不能靠“看起来对”。</text>

  <text x="30" y="384" class="svg-small">data = 42; ready = true; 在 x86 上常看起来正确，在 ARM 上可能先看到 ready。</text>
  <text x="30" y="408" class="svg-small">把代码拿到 ARM 上跑，或者直接用正确的同步原语。</text>
</svg>`
  },
  {
    nav: 'volatile 与锁',
    title: '7. volatile 不是同步，多变量用锁',
    caption: '<code>volatile</code> 常被误当成同步原语：它只告诉编译器“别把这个访问优化掉”，既不保证原子，也不建立 happens-before。单个计数用 atomic；多个变量要保持一致，就用 mutex 把整段临界区包起来。',
    code: 'volatile bool stop = false;  // 不是线程同步\nstd::atomic<bool> stop2{false};\n\nstd::mutex m;                // 多变量不变量用锁\nstd::lock_guard<std::mutex> lk(m);\n++data; ++size;              // 别人看不到中间态',
    highlight: [0, 1, 3, 4],
    stage: `
<svg viewBox="0 0 760 450" role="img" aria-label="volatile、atomic、mutex 三种工具各自适用的场景">
  <text x="30" y="30" class="svg-title">volatile、atomic、mutex：各管一件事</text>

  <rect x="30" y="50" width="220" height="290" rx="12" class="svg-box-bad"/>
  <text x="46" y="80" class="svg-title">volatile</text>
  <text x="46" y="116" class="svg-small">只管：别优化掉访问</text>
  <text x="46" y="146" class="svg-small">不保证：原子性</text>
  <text x="46" y="176" class="svg-small">不建立：happens-before</text>
  <text x="46" y="206" class="svg-small">适合：MMIO、信号标志</text>
  <text x="46" y="236" class="svg-small">不适合：线程同步</text>
  <text x="46" y="288" class="svg-small">信号处理中配 sig_atomic_t</text>

  <rect x="270" y="50" width="220" height="290" rx="12" class="svg-box-accent"/>
  <text x="286" y="80" class="svg-title">std::atomic</text>
  <text x="286" y="116" class="svg-small">单个变量的原子访问</text>
  <text x="286" y="146" class="svg-small">可选 relaxed /</text>
  <text x="286" y="176" class="svg-small">release / acquire</text>
  <text x="286" y="206" class="svg-small">适合：计数器、标志</text>
  <text x="286" y="236" class="svg-small">不负责：多变量一致</text>
  <text x="286" y="288" class="svg-small">发布数据时配 release/acquire</text>

  <rect x="510" y="50" width="220" height="290" rx="12" class="svg-box-good"/>
  <text x="526" y="80" class="svg-title">std::mutex</text>
  <text x="526" y="116" class="svg-small">临界区互斥</text>
  <text x="526" y="146" class="svg-small">lock / unlock 隐含同步</text>
  <text x="526" y="176" class="svg-small">适合：多个变量</text>
  <text x="526" y="206" class="svg-small">保护不变量</text>
  <text x="526" y="236" class="svg-small">可能阻塞，有开销</text>
  <text x="526" y="288" class="svg-small">拿不准时优先用锁</text>

  <rect x="30" y="364" width="700" height="64" rx="10" class="svg-box-warn"/>
  <text x="46" y="390" class="svg-small">data 和 size 必须一起变：各自 atomic 也不能保证同时被看到。</text>
  <text x="46" y="414" class="svg-small">把整段更新放进同一把锁的临界区，读者就不会看到中间态。</text>
</svg>`
  },
  {
    nav: '选择规则',
    title: '8. 怎么选：按场景直接查表',
    caption: '选择顺序：先问有没有共享；多个变量有约束就一律用锁；单变量再决定 relaxed 还是 acquire/release；拿不准就用默认 <code>seq_cst</code>。<code>volatile</code> 不在这张表里，因为它不是同步工具。',
    code: '// 默认：seq_cst，最省心\nstd::atomic<int> n{0};\nn.fetch_add(1, std::memory_order_relaxed);\n// 计数累加：relaxed 就够\n\n// 发布对象：release / acquire\n// 只初始化一次：call_once 或静态局部',
    highlight: [3, 4, 5, 6],
    stage: `
<svg viewBox="0 0 760 460" role="img" aria-label="按场景选择 mutex、atomic relaxed、release acquire、静态局部变量或 seq_cst">
  <text x="30" y="30" class="svg-title">怎么选：按场景查表</text>
  <rect x="30" y="48" width="700" height="36" rx="8" class="svg-box-accent"/>
  <text x="46" y="71" class="svg-text" style="font-weight:700">场景</text>
  <text x="300" y="71" class="svg-text" style="font-weight:700">选择</text>
  <text x="530" y="71" class="svg-text" style="font-weight:700">理由</text>

  <rect x="30" y="88" width="700" height="42" rx="6" class="svg-field"/>
  <text x="46" y="115" class="svg-text">多个变量要一起变</text>
  <text x="300" y="115" class="svg-mono" style="font-size:11.5px">std::mutex</text>
  <text x="530" y="115" class="svg-small">保护不变量，进出有同步</text>

  <rect x="30" y="136" width="700" height="42" rx="6" class="svg-field"/>
  <text x="46" y="163" class="svg-text">单个计数器 / 统计</text>
  <text x="300" y="163" class="svg-mono" style="font-size:11.5px">atomic + relaxed</text>
  <text x="530" y="163" class="svg-small">只要原子性，不要顺序</text>

  <rect x="30" y="184" width="700" height="42" rx="6" class="svg-field"/>
  <text x="46" y="211" class="svg-text">发布初始化好的对象</text>
  <text x="300" y="211" class="svg-mono" style="font-size:11.5px">atomic + release/acquire</text>
  <text x="530" y="211" class="svg-small">防止看到半成品</text>

  <rect x="30" y="232" width="700" height="42" rx="6" class="svg-field"/>
  <text x="46" y="259" class="svg-text">只初始化一次</text>
  <text x="300" y="259" class="svg-mono" style="font-size:11.5px">静态局部 / call_once</text>
  <text x="530" y="259" class="svg-small">标准保证线程安全</text>

  <rect x="30" y="280" width="700" height="42" rx="6" class="svg-field"/>
  <text x="46" y="307" class="svg-text">需要全局顺序 / 拿不准</text>
  <text x="300" y="307" class="svg-mono" style="font-size:11.5px">seq_cst（默认）</text>
  <text x="530" y="307" class="svg-small">最省心，代价可接受</text>

  <rect x="30" y="328" width="700" height="42" rx="6" class="svg-field"/>
  <text x="46" y="355" class="svg-text">硬件寄存器 / 信号处理</text>
  <text x="300" y="355" class="svg-mono" style="font-size:11.5px">volatile</text>
  <text x="530" y="355" class="svg-small">只防优化，不做同步</text>

  <text x="30" y="404" class="svg-small">先问“有没有共享”，再问“几个变量”；多变量不变量一律用锁。</text>
  <text x="30" y="428" class="svg-small">单变量再考虑内存序：默认 seq_cst，性能敏感处才降到 relaxed 或 acquire/release。</text>
</svg>`
  }
];
