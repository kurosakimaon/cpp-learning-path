    caption: '父节点用 shared_ptr 持有子节点，子节点也用 shared_ptr 指回父节点，就形成了<strong>环</strong>。外部引用消失后，父的强计数被子节点的成员占着，子的强计数被父节点的成员占着，两边都到不了 0，对象<strong>不可达却泄漏</strong>。',
    code: 'struct Child;                      // 前置声明\nstruct Parent {\n    std::shared_ptr<Child> child;    // 父持有子\n};\nstruct Child {\n    std::shared_ptr<Parent> parent;  // 形成环\n};',
    highlight: [2, 5],
    stage: `
<svg viewBox="0 0 760 440" role="img" aria-label="父子节点用 shared_ptr 互相持有，外部引用消失后两个强计数仍为 1，造成内存泄漏">

  {
