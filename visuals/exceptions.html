  {

    title: '7. 强异常安全：失败就当作没发生',
    caption: '异常安全有三个级别：<strong>不抛保证</strong>（nothrow，绝不会失败）、<strong>强保证</strong>（失败后对象状态不变，像没调用过）、<strong>基本保证</strong>（不泄漏，但状态可能改变）。copy-and-swap 是强保证的常用写法：先完整复制到临时对象，成功后再 swap；swap 不抛，所以失败时原对象毫发无损。',
    code: 'Widget& operator=(const Widget& other) {\n    Widget tmp(other);   // 可能抛，原对象没动\n    swap(tmp);           // noexcept：一次切换\n    return *this;\n}',

</svg>`
  },
