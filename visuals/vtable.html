  <text x="48" y="76" class="svg-title">Base* p</text>

  <line x1="170" y1="132" x2="170" y2="184" class="svg-arrow-accent" marker-end="url(#ah)"/>

  <text x="468" y="76" class="svg-title">Circle 的 vtable @0x5000</text>

    highlight: [4, 5],
    stage: `
<svg viewBox="0 0 760 450" role="img" aria-label="override 检查函数签名是否与基类虚函数一致">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker>

  <text x="48" y="248" class="svg-text">Derived 的 vtable 槽位被替换成</text>
  <text x="48" y="270" class="svg-small">Derived::speak，基类指针调用会落到它。</text>

  <rect x="220" y="92" width="130" height="52" rx="8" class="svg-box-bad"/>
  <text x="285" y="123" text-anchor="middle" class="svg-mono">只调 ~Base()</text>
  <text x="48" y="182" class="svg-bad-text">Derived 的析构函数不会执行</text>
  <text x="48" y="210" class="svg-text">派生类持有的资源没人释放，</text>
  <text x="48" y="234" class="svg-text">行为未定义，常见结果是泄漏。</text>
  <text x="48" y="262" class="svg-small">非虚析构没有 vtable 入口可供查找。</text>

  <text x="400" y="30" class="svg-small">有虚析构：正确</text>
  <rect x="390" y="48" width="340" height="232" rx="12" class="svg-box-good"/>
  <text x="408" y="76" class="svg-title">Base* p = new Derived</text>
  <rect x="408" y="92" width="100" height="52" rx="8" class="svg-box"/>
  <text x="458" y="123" text-anchor="middle" class="svg-mono">delete p</text>
  <line x1="510" y1="118" x2="536" y2="118" class="svg-arrow" marker-end="url(#ah)"/>
  <rect x="540" y="92" width="80" height="52" rx="8" class="svg-box-good"/>
  <text x="580" y="116" text-anchor="middle" class="svg-mono">~Derived</text>
  <text x="580" y="134" text-anchor="middle" class="svg-small">先</text>
  <line x1="622" y1="118" x2="648" y2="118" class="svg-arrow" marker-end="url(#ah)"/>
  <rect x="652" y="92" width="66" height="52" rx="8" class="svg-box-good"/>
  <text x="685" y="123" text-anchor="middle" class="svg-mono">~Base</text>
  <text x="408" y="182" class="svg-good-text">通过 vtable 找到动态类型的析构入口</text>
  <text x="408" y="210" class="svg-text">先销毁派生类部分，再销毁基类部分，</text>
  <text x="408" y="234" class="svg-text">顺序与构造严格相反。</text>
  <text x="408" y="262" class="svg-small">delete p 时 p 的静态类型仍是 Base*。</text>

  <rect x="30" y="310" width="700" height="120" rx="12" class="svg-box-warn"/>
  <text x="50" y="340" class="svg-title">规则</text>
  <text x="50" y="368" class="svg-text">只要一个类可能被通过基类指针 delete，它的析构函数就必须是 virtual。</text>
  <text x="50" y="394" class="svg-text">实践中：基类只要有虚函数，就顺手写上 virtual ~Base() = default;</text>
  <text x="50" y="418" class="svg-mono">添加虚析构会让类失去平凡析构等性质，但正确性优先。</text>
</svg>`
  }
];

document.getElementById('stepCountLabel').textContent = '共 ' + window.STEPS.length + ' 步';
