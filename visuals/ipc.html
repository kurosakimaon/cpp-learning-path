<svg viewBox="0 0 760 430" role="img" aria-label="共享内存的四个常见坑：名字残留、裸指针、容器内部指针、权限与清理">

  <text x="48" y="108" class="svg-text">进程崩溃后 /dev/shm/demo 还在</text>
  <text x="48" y="132" class="svg-small">create_only 会失败</text>
  <text x="48" y="156" class="svg-small">→ 先 remove，或用 open_or_create</text>

  <text x="418" y="132" class="svg-small">存下来的 T* 到对面无效</text>
  <text x="418" y="156" class="svg-small">→ 用 offset_ptr&lt;T&gt; 或相对偏移</text>

  <rect x="30" y="210" width="330" height="140" rx="12" class="svg-box-warn"/>

  <text x="418" y="312" class="svg-small">用完 remove()，否则会一直占内存</text>

  <text x="30" y="388" class="svg-small">共享内存不是“传变量”，而是让两个进程看同一块物理内存；协议和同步都要自己定。</text>
