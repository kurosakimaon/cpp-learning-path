<script>
// ========== 算法信息 ==========
const algorithms = {
  bubble: {
    name: '冒泡排序',
    best: 'O(n)',
    avg: 'O(n²)',
    worst: 'O(n²)',
    space: 'O(1)',
    stable: '稳定',
    desc: '每轮遍历未排序部分，相邻元素两两比较，大的往后"冒泡"。就像水里的气泡往上冒一样。<br><strong>思路：</strong>重复遍历数组，每次比较相邻元素，如果顺序不对就交换。每一轮结束，最大的元素就"冒"到了末尾。<br><strong>适用场景：</strong>教学演示，实际中很少用（太慢）。'
  },
  selection: {
    name: '选择排序',
    best: 'O(n²)',
    avg: 'O(n²)',
    worst: 'O(n²)',
    space: 'O(1)',
    stable: '不稳定',
    desc: '每轮从未排序部分选出最小的，放到已排序部分的末尾。<br><strong>思路：</strong>找到最小值 → 交换到前面 → 缩小范围 → 重复。<br><strong>特点：</strong>交换次数少（每轮最多1次），但比较次数多。适合交换成本高的场景。'
  },
  insertion: {
    name: '插入排序',
    best: 'O(n)',
    avg: 'O(n²)',
    worst: 'O(n²)',
    space: 'O(1)',
    stable: '稳定',
    desc: '像扑克牌理牌一样，把每个元素插入到前面已排好序的部分中的正确位置。<br><strong>思路：</strong>从第2个元素开始，向前比较，大的往后挪，找到合适位置插入。<br><strong>特点：</strong>对几乎有序的数组效率极高（接近O(n)）。小规模数据首选。'
  },
  shell: {
    name: '希尔排序',
    best: 'O(n log n)',
    avg: '取决于增量序列',
    worst: 'O(n²)',
    space: 'O(1)',
    stable: '不稳定',
    desc: '插入排序的改进版。先按较大的间隔排序，逐步缩小间隔，最后做一次插入排序。<br><strong>思路：</strong>分组插入排序 → 缩小间隔 → 再分组 → 直到间隔为1。<br><strong>特点：</strong>比插入排序快，又比快速排序简单。复杂度取决于增量序列，本页用的折半增量最坏 O(n²)。'
  },
  merge: {
    name: '归并排序',
    best: 'O(n log n)',
    avg: 'O(n log n)',
    worst: 'O(n log n)',
    space: 'O(n)',
    stable: '稳定',
    desc: '分治思想。把数组一分为二，分别排好序，再合并起来。<br><strong>思路：</strong>分解 → 递归排序 → 合并。典型的"分而治之"。<br><strong>特点：</strong>时间复杂度稳定（最坏也是O(n log n)），但需要额外空间。需要稳定性时选它。'
  },
  quick: {
    name: '快速排序',
    best: 'O(n log n)',
    avg: 'O(n log n)',
    worst: 'O(n²)',
    space: 'O(log n)，最坏 O(n)',
    stable: '不稳定',
    desc: '分治思想的另一种实现。选一个基准值（pivot），把数组分成小于pivot和大于pivot的两部分，递归排。<br><strong>思路：</strong>选基准 → 分区（小的左，大的右）→ 递归左右。<br><strong>特点：</strong>平均性能最好，是实际中最常用的排序算法。std::sort 基本就是用它。递归栈平均 O(log n)，极端划分下最坏 O(n)。'
  },
  heap: {
    name: '堆排序',
    best: 'O(n log n)',
    avg: 'O(n log n)',
    worst: 'O(n log n)',
    space: 'O(1)',
    stable: '不稳定',
    desc: '利用堆这种数据结构。先建大顶堆，然后不断把堆顶（最大值）和末尾交换，再调整堆。<br><strong>思路：</strong>建堆 → 取堆顶 → 交换到末尾 → 调整堆 → 重复。<br><strong>特点：</strong>时间稳定，空间O(1)。Top K 问题更适合维护一个大小为 K 的堆（O(n log K)），不必对整个数组做堆排序。'
  },
  counting: {
    name: '计数排序',
    best: 'O(n+k)',
    avg: 'O(n+k)',
    worst: 'O(n+k)',
    space: 'O(n+k)',
    stable: '稳定',
    desc: '非比较排序。统计每个值出现的次数，然后按顺序输出。<br><strong>思路：</strong>计数 → 前缀和 → 反向填充（保证稳定性）。<br><strong>特点：</strong>速度快，但只适用于整数且范围不大的情况。k是数据范围大小。'
  }
};

// ========== 全局状态 ==========
let array = [];
let comparisons = 0;
let swapCount = 0;
let startTime = 0;
let isRunning = false;
let isPaused = false;
let animationId = null;
let stepQueue = [];
let currentStep = 0;

// ========== 工具函数 ==========
function generateArray(size) {
  array = [];
  for (let i = 0; i < size; i++) {
    array.push(Math.floor(Math.random() * 95) + 5); // 5-99
  }
  comparisons = 0;
  swapCount = 0;
  currentStep = 0;
  stepQueue = [];
  updateStats();
  renderBars();
}

function renderBars(highlights = {}) {
  const container = document.getElementById('barsContainer');
  container.innerHTML = '';
  const maxVal = Math.max(...array);
  array.forEach((val, idx) => {
    const bar = document.createElement('div');
    bar.className = 'bar';
    if (highlights.comparing && highlights.comparing.includes(idx)) bar.classList.add('comparing');
    if (highlights.swapping && highlights.swapping.includes(idx)) bar.classList.add('swapping');
    if (highlights.sorted && highlights.sorted.includes(idx)) bar.classList.add('sorted');
    if (highlights.pivot === idx) bar.classList.add('pivot');
    bar.style.height = (val / maxVal * 100) + '%';
    if (array.length <= 30) {
      const label = document.createElement('span');
      label.className = 'bar-label';
      label.textContent = val;
      bar.appendChild(label);
    }
    container.appendChild(bar);
  });
}

function updateStats(progress = 0) {
  document.getElementById('comparisons').textContent = comparisons;
  document.getElementById('swaps').textContent = swapCount;
  const elapsed = startTime ? (performance.now() - startTime).toFixed(0) : 0;
  document.getElementById('timeElapsed').textContent = elapsed + 'ms';
  document.getElementById('progress').textContent = progress + '%';
}

function getDelay() {
  const speed = parseInt(document.getElementById('speedSlider').value);
  // speed 1 = slow (300ms), speed 100 = fast (1ms)
  return Math.max(1, 300 - speed * 3);
}

function sleep(ms) {
  return new Promise(resolve => {
    animationId = setTimeout(resolve, ms);
  });
}

// ========== 排序算法实现（生成步骤） ==========
// 每个算法返回一个步骤数组，每步包含：type, indices, description
function generateSteps(algo) {
  const arr = [...array];
  const steps = [];
  const n = arr.length;
  const sortedIndices = new Set();

  function record(type, indices, desc) {
    steps.push({
      type,
      indices: [...indices],
      description: desc,
      array: [...arr],
      sorted: new Set(sortedIndices)
    });
  }

  switch (algo) {
    case 'bubble': {
      for (let i = 0; i < n - 1; i++) {
        let swapped = false;
        for (let j = 0; j < n - 1 - i; j++) {
          record('compare', [j, j+1], `比较 arr[${j}]=${arr[j]} 和 arr[${j+1}]=${arr[j+1]}`);
          if (arr[j] > arr[j+1]) {
            [arr[j], arr[j+1]] = [arr[j+1], arr[j]];
            record('swap', [j, j+1], `交换：arr[${j}] > arr[${j+1}]，交换位置`);
            swapped = true;
          }
        }
        sortedIndices.add(n - 1 - i);
        record('sorted', [n - 1 - i], `第 ${i+1} 轮结束，arr[${n-1-i}]=${arr[n-1-i]} 已排好`);
        if (!swapped) {
          for (let k = 0; k < n - 1 - i; k++) sortedIndices.add(k);
          record('done', [], '已经有序，提前结束！');
          break;
        }
      }
      sortedIndices.add(0);
      break;
    }
    case 'selection': {
      for (let i = 0; i < n - 1; i++) {
        let minIdx = i;
        record('compare', [i], `第 ${i+1} 轮，从位置 ${i} 开始找最小值`);
        for (let j = i + 1; j < n; j++) {
          record('compare', [minIdx, j], `比较当前最小 arr[${minIdx}]=${arr[minIdx]} 和 arr[${j}]=${arr[j]}`);
          if (arr[j] < arr[minIdx]) {
            minIdx = j;
          }
        }
        if (minIdx !== i) {
          [arr[i], arr[minIdx]] = [arr[minIdx], arr[i]];
          record('swap', [i, minIdx], `找到最小值 ${arr[minIdx]}（原位置${minIdx}），与位置 ${i} 交换`);
        }
        sortedIndices.add(i);
        record('sorted', [i], `位置 ${i} 的值 ${arr[i]} 已排好`);
      }
      sortedIndices.add(n-1);
      break;
    }
    case 'insertion': {
      sortedIndices.add(0);
      record('sorted', [0], `第1个元素 ${arr[0]} 默认已排序`);
      for (let i = 1; i < n; i++) {
        let key = arr[i];
        let j = i - 1;
        record('compare', [i], `取出 arr[${i}]=${key}，向前找插入位置`);
        while (j >= 0 && arr[j] > key) {
          record('compare', [j, j+1], `arr[${j}]=${arr[j]} > ${key}，后移`);
          arr[j+1] = arr[j];
          record('swap', [j, j+1], `arr[${j}] 后移到 arr[${j+1}]`);
          j--;
        }
        arr[j+1] = key;
        sortedIndices.add(i);
        record('sorted', [j+1], `把 ${key} 插入到位置 ${j+1}，前 ${i+1} 个元素已排好`);
      }
      break;
    }
    case 'shell': {
      let gaps = [];
      let gap = Math.floor(n / 2);
      while (gap > 0) { gaps.push(gap); gap = Math.floor(gap / 2); }
      
      for (const gap of gaps) {
        record('compare', [], `间隔 = ${gap}，对每组进行插入排序`);
        for (let i = gap; i < n; i++) {
          let temp = arr[i];
          let j = i;
          record('compare', [i], `取出 arr[${i}]=${temp}，与前面间隔 ${gap} 的元素比较`);
          while (j >= gap && arr[j - gap] > temp) {
            record('compare', [j-gap, j], `arr[${j-gap}]=${arr[j-gap]} > ${temp}，后移`);
            arr[j] = arr[j - gap];
            record('swap', [j-gap, j], `arr[${j-gap}] 移到 arr[${j}]`);
            j -= gap;
          }
          arr[j] = temp;
          record('sorted', [j], `${temp} 插入到位置 ${j}`);
        }
      }
      for (let i = 0; i < n; i++) sortedIndices.add(i);
      break;
    }
    case 'merge': {
      function mergeSort(left, right) {
        if (left >= right) return;
        const mid = Math.floor((left + right) / 2);
        record('compare', [left, mid, right], `分解：左[${left}..${mid}] 右[${mid+1}..${right}]`);
        mergeSort(left, mid);
        mergeSort(mid + 1, right);
        
        // 合并
        const temp = [];
        let i = left, j = mid + 1;
        record('compare', [left, right], `合并 [${left}..${mid}] 和 [${mid+1}..${right}]`);
        while (i <= mid && j <= right) {
          record('compare', [i, j], `比较 arr[${i}]=${arr[i]} 和 arr[${j}]=${arr[j]}`);
          if (arr[i] <= arr[j]) {
            temp.push(arr[i++]);
          } else {
            temp.push(arr[j++]);
          }
        }
        while (i <= mid) temp.push(arr[i++]);
        while (j <= right) temp.push(arr[j++]);
        for (let k = 0; k < temp.length; k++) {
          arr[left + k] = temp[k];
          record('swap', [left + k], `写入 arr[${left+k}] = ${temp[k]}`);
        }
        record('sorted', [], `区间 [${left}..${right}] 排序完成`);
      }
      mergeSort(0, n - 1);
      for (let i = 0; i < n; i++) sortedIndices.add(i);
      break;
    }
    case 'quick': {
      function quickSort(low, high) {
        if (low >= high) {
          if (low === high) sortedIndices.add(low);
          return;
        }
        // 三数取中选pivot
        const mid = Math.floor((low + high) / 2);
        if (arr[low] > arr[mid]) [arr[low], arr[mid]] = [arr[mid], arr[low]];
        if (arr[low] > arr[high]) [arr[low], arr[high]] = [arr[high], arr[low]];
        if (arr[mid] > arr[high]) [arr[mid], arr[high]] = [arr[high], arr[mid]];
        [arr[mid], arr[high-1]] = [arr[high-1], arr[mid]];
        const pivot = arr[high - 1];
        const pivotIdx = high - 1;
        
        record('compare', [low, mid, high], `三数取中，选 arr[${pivotIdx}]=${pivot} 作为基准`);
        
        let i = low, j = high - 1;
        while (true) {
          while (arr[++i] < pivot) {
            record('compare', [i], `i 向右：arr[${i}]=${arr[i]} < ${pivot}，继续`);
          }
          record('compare', [i], `i 停在 arr[${i}]=${arr[i]} >= ${pivot}`);
          while (arr[--j] > pivot) {
            record('compare', [j], `j 向左：arr[${j}]=${arr[j]} > ${pivot}，继续`);
          }
          record('compare', [j], `j 停在 arr[${j}]=${arr[j]} <= ${pivot}`);
          if (i < j) {
            [arr[i], arr[j]] = [arr[j], arr[i]];
            record('swap', [i, j], `i<j，交换 arr[${i}] 和 arr[${j}]`);
          } else {
            break;
          }
        }
        [arr[i], arr[pivotIdx]] = [arr[pivotIdx], arr[i]];
        record('swap', [i, pivotIdx], `基准归位：arr[${i}] ↔ arr[${pivotIdx}]`);
        sortedIndices.add(i);
        record('sorted', [i], `基准 ${pivot} 放到位置 ${i}，左边都小，右边都大`);
        
        quickSort(low, i - 1);
        quickSort(i + 1, high);
      }
      quickSort(0, n - 1);
      break;
    }
    case 'heap': {
      function heapify(size, root) {
        let largest = root;
        const left = 2 * root + 1;
        const right = 2 * root + 2;
        record('compare', [root, left, right], `检查节点 ${root}（值=${arr[root]}）的子节点`);
        if (left < size) {
          record('compare', [largest, left], `比较左子 ${left}=${arr[left]} 和当前最大 ${largest}=${arr[largest]}`);
          if (arr[left] > arr[largest]) largest = left;
        }
        if (right < size) {
          record('compare', [largest, right], `比较右子 ${right}=${arr[right]} 和当前最大 ${largest}=${arr[largest]}`);
          if (arr[right] > arr[largest]) largest = right;
        }
        if (largest !== root) {
          [arr[root], arr[largest]] = [arr[largest], arr[root]];
          record('swap', [root, largest], `交换：节点 ${root} 和 ${largest}`);
          heapify(size, largest);
        }
      }
      
      record('compare', [], '第一步：构建大顶堆');
      for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
        heapify(n, i);
      }
      record('sorted', [], '大顶堆构建完成');
      
      record('compare', [], '第二步：依次取出堆顶，放到末尾');
      for (let i = n - 1; i > 0; i--) {
        [arr[0], arr[i]] = [arr[i], arr[0]];
        record('swap', [0, i], `堆顶 ${arr[i]} 与末尾 arr[${i}] 交换`);
        sortedIndices.add(i);
        record('sorted', [i], `位置 ${i} 的值 ${arr[i]} 已排好`);
        heapify(i, 0);
      }
      sortedIndices.add(0);
      break;
    }
    case 'counting': {
      const maxVal = Math.max(...arr);
      const minVal = Math.min(...arr);
      const range = maxVal - minVal + 1;
      const count = new Array(range).fill(0);
      
      record('compare', [], `计数排序：范围 [${minVal}, ${maxVal}]，共 ${range} 个值`);
      
      for (let i = 0; i < n; i++) {
        count[arr[i] - minVal]++;
        record('compare', [i], `计数：${arr[i]} 出现次数 = ${count[arr[i]-minVal]}`);
      }
      
      record('compare', [], '计算前缀和（确定每个元素的位置）');
      for (let i = 1; i < range; i++) {
        count[i] += count[i - 1];
      }
      
      record('compare', [], '反向填充结果数组（保证稳定性）');
      const output = new Array(n);
      for (let i = n - 1; i >= 0; i--) {
        const pos = count[arr[i] - minVal] - 1;
        output[pos] = arr[i];
        count[arr[i] - minVal]--;
        record('swap', [i], `arr[${i}]=${arr[i]} 放到结果数组位置 ${pos}`);
      }
      
      for (let i = 0; i < n; i++) {
        arr[i] = output[i];
        sortedIndices.add(i);
      }
      record('sorted', [], '计数排序完成');
      break;
    }
  }

  steps.push({ type: 'done', indices: [], description: '🎉 排序完成！', array: [...arr], sorted: new Set(Array.from({length:n},(_,i)=>i)) });
  return steps;
}

// ========== 播放动画 ==========
async function playAnimation() {
  const algo = document.getElementById('algorithmSelect').value;
  stepQueue = generateSteps(algo);
  comparisons = 0;
  swapCount = 0;
  startTime = performance.now();
  isRunning = true;
  isPaused = false;
  
  document.getElementById('startBtn').disabled = true;
  document.getElementById('pauseBtn').disabled = false;
  document.getElementById('generateBtn').disabled = true;

  for (let i = 0; i < stepQueue.length; i++) {
    while (isPaused) {
      await sleep(50);
      if (!isRunning) return;
    }
    if (!isRunning) break;

    const step = stepQueue[i];
    array = [...step.array];
    
    if (step.type === 'compare') comparisons++;
    if (step.type === 'swap') swapCount++;
    
    const highlights = {};
    if (step.type === 'compare') highlights.comparing = step.indices;
    if (step.type === 'swap') highlights.swapping = step.indices;
    if (step.sorted) highlights.sorted = [...step.sorted];
    
    renderBars(highlights);
    const progress = Math.floor((i + 1) / stepQueue.length * 100);
    updateStats(progress);
    document.getElementById('stepInfo').textContent = `步骤 ${i+1}/${stepQueue.length}：${step.description}`;
    
    await sleep(getDelay());
  }
  
  isRunning = false;
  document.getElementById('startBtn').disabled = false;
  document.getElementById('pauseBtn').disabled = true;
  document.getElementById('generateBtn').disabled = false;
  renderBars({ sorted: Array.from({length: array.length}, (_, i) => i) });
}

// ========== 算法卡片渲染 ==========
function renderAlgoCards() {
  const grid = document.getElementById('algoGrid');
  for (const [key, info] of Object.entries(algorithms)) {
    const card = document.createElement('div');
    card.className = 'algo-card';
    if (key === document.getElementById('algorithmSelect').value) card.classList.add('active');
    card.innerHTML = `
      <div class="algo-name">${info.name}</div>
      <div class="algo-meta">
        <span class="algo-tag tag-time">时间 ${info.avg}</span>
        <span class="algo-tag tag-space">空间 ${info.space}</span>
        <span class="algo-tag tag-stable">${info.stable}</span>
      </div>
      <div class="algo-desc">${info.desc.split('<br>')[0]}</div>
    `;
    card.onclick = () => {
      document.getElementById('algorithmSelect').value = key;
      document.querySelectorAll('.algo-card').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      updateExplanation();
    };
    grid.appendChild(card);
  }
}

function updateExplanation() {
  const algo = document.getElementById('algorithmSelect').value;
  const info = algorithms[algo];
  document.getElementById('algoDescription').innerHTML = info.desc;
  document.getElementById('complexityBody').innerHTML = `
    <tr><td>${info.name}</td><td>${info.best}</td><td>${info.avg}</td><td>${info.worst}</td><td>${info.space}</td><td>${info.stable}</td></tr>
  `;
}

// ========== 事件绑定 ==========
document.getElementById('sizeSlider').addEventListener('input', e => {
  document.getElementById('sizeValue').textContent = e.target.value;
  generateArray(parseInt(e.target.value));
});

document.getElementById('speedSlider').addEventListener('input', e => {
  const val = parseInt(e.target.value);
  let label = '中速';
  if (val < 20) label = '极慢';
  else if (val < 40) label = '慢速';
  else if (val < 60) label = '中速';
  else if (val < 80) label = '快速';
  else label = '极快';
  document.getElementById('speedValue').textContent = label;
});

document.getElementById('generateBtn').addEventListener('click', () => {
  generateArray(parseInt(document.getElementById('sizeSlider').value));
});

document.getElementById('startBtn').addEventListener('click', () => {
  if (isRunning) return;
  playAnimation();
});

document.getElementById('pauseBtn').addEventListener('click', () => {
  isPaused = !isPaused;
  document.getElementById('pauseBtn').textContent = isPaused ? '▶ 继续' : '⏸ 暂停';
});

document.getElementById('resetBtn').addEventListener('click', () => {
  isRunning = false;
  isPaused = false;
  if (animationId) clearTimeout(animationId);
  generateArray(parseInt(document.getElementById('sizeSlider').value));
  document.getElementById('startBtn').disabled = false;
  document.getElementById('pauseBtn').disabled = true;
  document.getElementById('generateBtn').disabled = false;
  document.getElementById('pauseBtn').textContent = '⏸ 暂停';
  document.getElementById('stepInfo').textContent = '点击"开始排序"按钮，观察排序过程。黄色 = 正在比较，红色 = 正在交换，绿色 = 已排好。';
});

document.getElementById('algorithmSelect').addEventListener('change', () => {
  document.querySelectorAll('.algo-card').forEach(c => c.classList.remove('active'));
  const algo = document.getElementById('algorithmSelect').value;
  const cards = document.querySelectorAll('.algo-card');
  const idx = Object.keys(algorithms).indexOf(algo);
  if (cards[idx]) cards[idx].classList.add('active');
  updateExplanation();
});

// ========== 初始化 ==========
generateArray(30);
renderAlgoCards();
updateExplanation();
</script>
